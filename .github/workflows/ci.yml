name: CI

# Cổng Tầng 1 (offline). KHÔNG job nào ở đây chứng minh theme đẹp hay chạy được
# trên Linux Mint — việc đó thuộc Tầng 2, xem docs/plan/05-testing-strategy.md.

on:
  push:
    branches: [main, integration, "arena/**"]
  pull_request:
    branches: [main, integration]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: Tokens & contrast (offline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Self-test công thức WCAG
        run: python3 tools/lint/contrast.py
      - name: Generated files khớp token
        run: python3 tools/tokens/generate.py --scheme all --check
      - name: Báo cáo token + contrast
        run: python3 tools/tokens/generate.py --scheme all --report

  safety:
    name: Safety paths (không chạm hệ thống user)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tools/lint/safety_paths.py

  tests:
    name: Test Tầng 1
    runs-on: ubuntu-24.04
    needs: [tokens, safety]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests -t . -v

  scss:
    # Job này SKIP có chủ đích cho tới khi T04/T06 tạo file entry SCSS.
    # Khi có file, nó build bằng CẢ libsass (pysassc — toolchain của Mint, bằng chứng E18)
    # và dart-sass, rồi fail nếu hai compiler lệch nhau về mặt tồn tại selector (ADR-004).
    name: SCSS dual-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài 2 compiler (chỉ trong CI runner, không phải máy người dùng)
        run: |
          pip install --quiet libsass
          npm install --silent --no-fund --no-audit sass@1.77.8 || true
      - name: Build bằng libsass và dart-sass
        run: |
          set -e
          found=0
          for entry in src/cinnamon/cinnamon.scss src/gtk-3.0/sass/gtk.scss src/gtk-4.0/sass/gtk.scss; do
            if [ -f "$entry" ]; then
              found=1
              out_libsass="${entry%.scss}.libsass.css"
              out_dart="${entry%.scss}.dart.css"
              python3 -c "import sass,sys; open(sys.argv[2],'w').write(sass.compile(filename=sys.argv[1]))" "$entry" "$out_libsass"
              npx --no-install sass --no-source-map "$entry" "$out_dart" || echo "WARN dart-sass không chạy được với $entry"
              echo "OK build $entry"
            fi
          done
          if [ "$found" = "0" ]; then
            echo "SKIP: chưa có file SCSS entry nào (T04/T06/T10 chưa bắt đầu) — không phải lỗi."
          fi

  allowlist:
    # Job placeholder cho tools/lint/allowlist.py (T01).
    # Sẽ enforce: PR chỉ được chạm file trong allow-list của Task: khai báo trong commit message.
    name: File allow-list per task
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Kiểm tra Task ID trong commit message
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            msg="$(git log -1 --format=%B "$sha")"
            if ! echo "$msg" | grep -qE '^(Task: T[0-9]{2}|Task: T-plan)'; then
              echo "✗ commit $sha thiếu dòng 'Task: Txx'"
              missing=1
            fi
          done <<< "$(git rev-list "$base..$head")"
          if [ "$missing" = "1" ]; then
            echo "Xem docs/plan/06-git-workflow.md §2 (quy ước commit) và §5 (allow-list)."
            exit 1
          fi
          echo "OK: mọi commit đều khai báo Task ID"
