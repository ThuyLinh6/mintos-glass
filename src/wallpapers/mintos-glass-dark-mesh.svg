<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="MintOS Glass — Dark Mesh">
  <!-- MintOS Glass · T16 · SVG tự vẽ · màu từ src/cinnamon/tokens/_tokens.scss
       Nền tối có chủ đích: nhãn icon desktop phải đạt >=3:1. Đo bằng
       tools/lint/wallpapers.py, không đoán. Xem MANIFEST.md -->
  <defs>
    <linearGradient id="mgMeshBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0b0c0e"/>
      <stop offset="1"   stop-color="#121316"/>
    </linearGradient>
    <radialGradient id="mgM1" gradientUnits="userSpaceOnUse" cx="400" cy="700" r="700">
      <stop offset="0" stop-color="#1f8f5f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1f8f5f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mgM2" gradientUnits="userSpaceOnUse" cx="1660" cy="880" r="760">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mgM3" gradientUnits="userSpaceOnUse" cx="1500" cy="150" r="560">
      <stop offset="0" stop-color="#3b9dff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#3b9dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#mgMeshBase)"/>
  <rect width="1920" height="1080" fill="url(#mgM1)"/>
  <rect width="1920" height="1080" fill="url(#mgM2)"/>
  <rect width="1920" height="1080" fill="url(#mgM3)"/>
</svg>
