<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="MintOS Glass — Dark (mặc định)">
  <!-- MintOS Glass · T16 · SVG tự vẽ · màu từ src/cinnamon/tokens/_tokens.scss
       Nền tối có chủ đích: nhãn icon desktop phải đạt >=3:1. Đo bằng
       tools/lint/wallpapers.py, không đoán. Xem MANIFEST.md -->
  <defs>
    <linearGradient id="mgBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0b0c0e"/>
      <stop offset="0.55" stop-color="#121316"/>
      <stop offset="1"    stop-color="#17181c"/>
    </linearGradient>
    <radialGradient id="mgGlow" gradientUnits="userSpaceOnUse"
                    cx="330" cy="900" r="820">
      <stop offset="0"   stop-color="#3ddc97" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#1f8f5f"  stop-opacity="0.08"/>
      <stop offset="1"   stop-color="#1f8f5f"  stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#mgBase)"/>
  <rect width="1920" height="1080" fill="url(#mgGlow)"/>
</svg>
